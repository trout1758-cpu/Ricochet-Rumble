<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c1a26">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ricochet Pad">
  <title>Ricochet Pad</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1c1a26;
      color: #fff;
      font-family: system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
    /* safe-area probe read by pad.js */
    #safe { position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    .overlay {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(10, 8, 18, 0.88); z-index: 10; text-align: center; padding: 24px;
    }
    .hidden { display: none !important; }
    #rotate { display: none; flex-direction: column; gap: 14px; font-weight: 800; font-size: 20px; }
    #rotate svg { width: 72px; height: 72px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: flex; } }
    .sheet {
      background: #2a2738; border-radius: 18px; padding: 18px 22px; max-width: 420px; width: 100%;
      text-align: left; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    .sheet h2 { margin: 0 0 10px; font-size: 20px; font-weight: 900; }
    .sheet label { display: flex; align-items: center; gap: 12px; padding: 10px 0; font-size: 16px; font-weight: 600; }
    .sheet input { width: 22px; height: 22px; accent-color: #ffcd45; }
    .sheet p { margin: 8px 0 0; font-size: 13px; opacity: 0.7; line-height: 1.4; }
    .sheet button {
      margin-top: 14px; width: 100%; padding: 12px; border: 0; border-radius: 12px;
      background: #ffcd45; color: #4a3500; font-size: 17px; font-weight: 900;
    }
  </style>
</head>
<body>
  <canvas id="pad"></canvas>
  <div id="safe"></div>

  <div id="rotate" class="overlay">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
    Turn your phone sideways
  </div>

  <div id="settings" class="overlay hidden">
    <div class="sheet">
      <h2>Controller settings</h2>
      <label><input type="checkbox" id="opt-release"> Fire when I let go of the aim stick</label>
      <label><input type="checkbox" id="opt-haptics"> Vibration</label>
      <label><input type="checkbox" id="opt-swap"> Left-handed (drive on the right)</label>
      <p id="opt-note"></p>
      <button id="opt-done">Done</button>
    </div>
  </div>

  <script src="../js/protocol.js"></script>
  <script src="pad.js"></script>
</body>
</html>

# Builds the Ricochet Rumble app for Android tablets (the tablet is the big
# screen; phones join over Wi-Fi). Runs when the tablet app or the game changes,
# so the APK always includes the newest game. Pushes to main publish it on the
# "tablet-latest" release, so one fixed link always downloads the newest build.
name: Android tablet app

on:
  push:
    paths:
      - 'tablet-android/**'
      - 'game/**'
      - '.github/workflows/android-tablet.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-tablet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test the server, phone relay and updater
        run: tablet-android/test/run.sh

      - name: Stamp the bundled game's version
        run: |
          sha=$(git log -1 --format=%H -- game)
          date=$(TZ=UTC git log -1 --date=iso-strict-local --format=%cd -- game)
          printf '{"sha":"%s","date":"%s"}\n' "$sha" "$date" > game/build.json
          cat game/build.json
          echo "GAME_SHORT=${sha:0:7}" >> "$GITHUB_ENV"
          echo "GAME_DATE=$(TZ=UTC git log -1 --date=format-local:'%b %d, %Y %H:%M UTC' --format=%cd -- game)" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: tablet-android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp tablet-android/app/build/outputs/apk/release/app-release.apk RicochetRumble-Tablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RicochetRumble-Tablet-apk
          path: RicochetRumble-Tablet.apk

      - name: Publish "tablet-latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tablet-latest --yes --cleanup-tag || true
          gh release create tablet-latest RicochetRumble-Tablet.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ricochet Rumble for Android tablets — build ${GITHUB_RUN_NUMBER}" \
            --notes "Install RicochetRumble-Tablet.apk on an Android tablet (Android 8.0 or newer) to use it as the big screen for Ricochet Rumble; phones join over Wi-Fi by scanning the QR code in the lobby. Includes the game from ${GAME_DATE} (${GAME_SHORT}). Already installed? Update the game from inside the app: Settings > Check for updates."

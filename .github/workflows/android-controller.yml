name: Android controller APK

on:
  push:
    paths:
      - 'controller-android/**'
      - '.github/workflows/android-controller.yml'
  pull_request:
    paths:
      - 'controller-android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RicochetPad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RicochetPad-apk
          path: controller-android/RicochetPad.apk

      # Every push replaces the APK on the "controller-latest" release, so
      # one fixed link always downloads the newest build onto a phone.
      - name: Publish "controller-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete controller-latest --yes --cleanup-tag || true
          gh release create controller-latest RicochetPad.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ricochet Pad (Android controller) — latest build" \
            --notes "Install RicochetPad.apk on an Android phone (8.0+) to use it as a Bluetooth controller for Ricochet Rumble. Built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}."

name: Android controller APK

on:
  push:
    paths:
      - 'controller-android/**'
      - '.github/workflows/android-controller.yml'
  pull_request:
    paths:
      - 'controller-android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller-android
    env:
      # Optional: set these repository secrets to push every build to your
      # phone with Firebase App Distribution (see README).
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk RicochetPad.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RicochetPad-apk
          path: controller-android/RicochetPad.apk

      - name: Send to testers (Firebase App Distribution)
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          notes="$(git log -1 --pretty=%s) (${GITHUB_REF_NAME}@${GITHUB_SHA::7})"
          npx --yes firebase-tools@13 appdistribution:distribute RicochetPad.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "$FIREBASE_TESTERS" \
            --release-notes "$notes"
          rm -f "$RUNNER_TEMP/firebase-sa.json"

      # On main (or when run by hand) publish the APK as a downloadable
      # release, so it can be grabbed straight from the phone's browser.
      - name: Publish "controller-latest" release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete controller-latest --yes --cleanup-tag || true
          gh release create controller-latest RicochetPad.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Ricochet Pad (Android controller) — latest build" \
            --notes "Install RicochetPad.apk on an Android phone (8.0+) to use it as a Bluetooth controller for Ricochet Rumble. Built from ${GITHUB_SHA}."
